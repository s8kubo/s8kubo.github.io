  <h1>20260902</h1>

<p>バイトに向かっていると左から自転車が迫ってきてはねられた。やけに冷静な私は「どうしてはねたんですか？」と詰める。せびれば1万円くらい貰えたかもしれない。マイナスからのスタート。</p>

<p>バイト。<br>
サンリオのキャラクター「ゾウ自転車」について先輩と語らう。これからはゾウ自転車の時代。ポムポムプリンはもう古い。</p>

<p>フォトスタジオの撮影用照明4台のうち3台が壊れており、先行きが不安。</p>

<p>帰宅し昼寝。14時ごろに15分ほどの睡眠をとるといいらしい。パワーナップ。</p>

<p>ワークショップの中間発表が金曜にあるので案を練る。</p>
