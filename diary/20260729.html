  <h1>20260729</h1>

<p>体調を崩す。バイトの時間が早すぎるのが原因なのか、私が単に早く寝られないのが原因なのか。社会的に考えると必ず後者が正しい。睡眠時間を確保できないのは労働者側に責任がある。</p>
<p></p>
<p>外は暑いのでフードデリバリーで油そばを注文。その間にお風呂に入る。寝ていただけなのに身体が勝手に汚れていくのは不服だ。油そばが届いたが、店から距離があったらしく、少しぬるい。電子レンジで温める。外はこんなにも暑いのに、なぜこの油そばはレンジでもう一度過熱しなければならないほどぬるいのか。</p>
<p></p>
<p>ゴロゴロを挟みつつ、数日溜めていた日記を書く。あれだけ寝たのにまだ眠たい。</p>
