<p>だらだらと生きる。M-1のエントリー用紙を提出、ラーメンを食べて泥のように眠る。カウリスマキの映画を引き延ばしたようなつまらない夢を見て、流石につまらなすぎて起床すると16時になっていた。焼きそばを作って食べ、ツイッターでレスバトルをしたり、『知の編集術』『眼がスクリーンになるとき』『反=日本語論』を跨ぎながら読んだり、ヤクルト1000を飲んだりしていたら朝5時になっていた。寝たくない。眠たくなるまで寝ないと人間はどうなるのか。私には体力がないが、抑圧からの反動で知的好奇心だけは豊富に在庫がある状態。</p>
