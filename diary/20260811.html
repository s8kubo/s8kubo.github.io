  <h1>20260811</h1>

<p>昼過ぎに起き、ネタを暗唱しながら大阪へ。ラッキーなことに「京とれいん雅洛」に乗ることができた。</p>
<p></p>
<p>出番は2分。一瞬で漫才は終わる。0.5ウケが2回くらいあった。出番終わりに何故か震えてくる。帰りに合否発表があり、我々は落ちていた。</p>
<p></p>
<p>パートナーが作ってくれたラーメンを食べ、最近行っていなかった寝台船へ。2時半くらいまで飲む。</p>
<p>カウンターは先鋭化されたお笑い戦場と化していた。頭の回転勝負。アルコールが捗る。家に帰ってこのまま徹夜して岡山に向かうつもりだったがどっと疲れてしまい就寝する。</p>
