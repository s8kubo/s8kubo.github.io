  <h1>20260904</h1>

<p>バイト後、ワークショップの中間発表。同じゼミの学生が講師をやっているのだが、中々厳しい物言いをしていてカッコいい。</p>

<p>海鮮丼とポテトサラダを食べ、少し寝ていたらいつもの怒鳴り声、しかも今回は特大のものが雪崩のように来たので、しびれを切らし警察を呼ぶ。我慢ならないし、手の震えも止まらない。事情聴取を受け、飲みに行く。<br>
常連たちはお互いに名前を知らなくても話を親身に聞いてくれるし、楽しい。<br>
ドンキーコングのトロッコのおもちゃを走らせながら昨今の邦画について話し、日付変わる前に帰宅。就寝。
</p>
