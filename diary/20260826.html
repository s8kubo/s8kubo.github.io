<p>17時まで寝る。起床。驚愕し、スーパーでプルコギの素を買って白米と混ぜて食べ、飲みに行く。パートナーからパッタイを作っていると連絡が来る。</p>

<p>そういえばワークショップに行き忘れていた。HoudiniとTouchDesignerのワークショップ。</p>
